name: AI review health

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise the reviewer secret
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AI_REVIEW_MODEL: gemini-3.7-flash
          AI_REVIEW_MODEL_FALLBACKS: "gemini-3.6-flash,gemini-3.5-flash-lite"
        run: |
          set -u
          if [ -z "${GOOGLE_API_KEY:-}" ]; then
            echo "::error::GOOGLE_API_KEY is not set"
            exit 1
          fi

          IFS=',' read -ra FALLBACKS <<< "${AI_REVIEW_MODEL_FALLBACKS}"
          MODELS=("${AI_REVIEW_MODEL}" "${FALLBACKS[@]}")

          for model in "${MODELS[@]}"; do
            model="$(echo "$model" | xargs)"
            [ -z "$model" ] && continue
            status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent" \
              -H "x-goog-api-key: ${GOOGLE_API_KEY}" \
              -H "content-type: application/json" \
              -d '{"contents":[{"parts":[{"text":"ping"}]}]}')
            echo "${model}: ${status}"
            if [ "${status}" = "200" ]; then
              echo "key is healthy via ${model}"
              exit 0
            fi
            if [ "${status}" = "401" ] || [ "${status}" = "403" ]; then
              echo "::error::Google API rejected the key (${status}). Rotate GOOGLE_API_KEY."
              cat /tmp/resp.json || true
              exit 1
            fi
          done

          echo "::error::No model in the chain returned 200"
          cat /tmp/resp.json || true
          exit 1

      - name: Open an issue if the key is unhealthy
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "AI reviewer: GOOGLE_API_KEY is unhealthy";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ai-reviewer",
            });
            if (existing.some(i => i.title === title)) {
              console.log("issue already open");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["ai-reviewer", "ops"],
              body: [
                "The daily reviewer health check failed.",
                "",
                "No model in the fallback chain returned 200.",
                "",
                "## What to do",
                "1. Verify the key in the Google AI Studio console.",
                "   The secret must be a long-lived `AIzaSy...` key, not an `AQ.` session token.",
                "2. Update the repository secret `GOOGLE_API_KEY`.",
                "3. Re-run the health workflow to confirm.",
                "",
                "See `docs/runbook.md` for the rotation procedure.",
              ].join("\n"),
            });
