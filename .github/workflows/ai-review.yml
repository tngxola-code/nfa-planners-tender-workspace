name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      key_present: ${{ steps.check.outputs.key_present }}
    steps:
      - id: check
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "${GOOGLE_API_KEY:-}" ]; then
            echo "::warning::GOOGLE_API_KEY is not set. AI reviewers will be skipped."
            echo "key_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "key_present=true" >> "$GITHUB_OUTPUT"

  detect:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      reviewers: ${{ steps.d.outputs.reviewers }}
      escalations: ${{ steps.d.outputs.escalations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt
          python3 .github/ai-reviewers/detect.py < /tmp/changed.txt

  review:
    needs: [detect, preflight]
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && needs.preflight.outputs.key_present == 'true'
    strategy:
      fail-fast: false
      matrix:
        persona: [go, flutter, security, architect]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build context
        if: contains(needs.detect.outputs.reviewers, matrix.persona)
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.txt
          find docs/adr -name '*.md' -exec cat {} \; > /tmp/adrs.txt 2>/dev/null || true
          cp api/openapi.yaml /tmp/contract.txt 2>/dev/null || true
          head -200 docs/open-questions.md > /tmp/questions.txt 2>/dev/null || true

      - name: Run persona
        if: contains(needs.detect.outputs.reviewers, matrix.persona)
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AI_REVIEW_MODEL: gemini-3.7-flash
          AI_REVIEW_MODEL_FALLBACKS: "gemini-3.6-flash,gemini-3.5-flash-lite"
        run: |
          python3 .github/ai-reviewers/review.py \
            --persona ${{ matrix.persona }} \
            --diff /tmp/diff.txt \
            --adrs /tmp/adrs.txt \
            --contract /tmp/contract.txt \
            --questions /tmp/questions.txt \
            --output /tmp/result.json

      - name: Skip if not required
        if: contains(needs.detect.outputs.reviewers, matrix.persona) == false
        run: |
          echo '{"verdict":"pass","comment":"Not required for this diff.","summary":"skipped"}' > /tmp/result.json

      - name: Ensure a result exists
        if: always()
        run: |
          if [ ! -s /tmp/result.json ]; then
            echo '{"verdict":"pass","comment":"The reviewer step produced no result (infrastructure failure, not a code verdict). See the step log.","summary":"reviewer unavailable"}' > /tmp/result.json
          fi

      - name: Post comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('/tmp/result.json','utf8'));
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### ai-review / ${{ matrix.persona }}\n\n' + r.comment,
            });

      - name: Set check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('/tmp/result.json','utf8'));
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'ai-review / ${{ matrix.persona }}',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: r.verdict === 'fail' ? 'failure' : 'success',
              output: { title: r.summary, summary: r.comment.slice(0, 65000) },
            });

  escalate:
    needs: [detect, preflight]
    if: needs.detect.outputs.escalations != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = '${{ needs.detect.outputs.escalations }}'.split(',').filter(Boolean);
            for (const label of labels) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [label],
              });
            }

  no-reviewers:
    needs: [preflight]
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && needs.preflight.outputs.key_present != 'true'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'ai-review / status',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'No reviewers ran — GOOGLE_API_KEY is not set',
                summary: 'All four personas were skipped because the repository secret is unset. This PR has had no automated review. See docs/runbook.md.',
              },
            });
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### ai-review',
                '',
                '**No reviewers ran.** `GOOGLE_API_KEY` is not set, so all four personas were skipped.',
                'This PR has had no automated review. The green checks below do not mean it was reviewed.',
                '',
                'See `docs/runbook.md` → GOOGLE_API_KEY.',
              ].join('\n'),
            });
